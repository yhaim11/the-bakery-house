<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#080c16"/>
    </radialGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="75%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Warm Bread Crust Gradient -->
    <linearGradient id="breadCrust" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="35%" stop-color="#d97706"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Scoring Highlight -->
    <linearGradient id="scoreGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Golden Wheat Gradient -->
    <linearGradient id="wheatGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base for Mobile App / PWA Icon (iOS & Android standard rounded rect) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="8" filter="url(#badgeShadow)"/>

  <!-- Inner Subtle Concentric Ring -->
  <circle cx="256" cy="245" r="195" stroke="#f59e0b" stroke-opacity="0.22" stroke-width="2.5" stroke-dasharray="6 6"/>
  <circle cx="256" cy="245" r="185" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Golden Radial Ambient Center Glow -->
  <circle cx="256" cy="240" r="140" fill="#f59e0b" fill-opacity="0.12"/>

  <!-- Golden Wheat Ears Framing Left Side -->
  <g fill="url(#wheatGold)" filter="url(#iconGlow)">
    <!-- Left Wheat Stem -->
    <path d="M 125 350 C 105 280 110 200 155 145" fill="none" stroke="url(#wheatGold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Left Grains -->
    <ellipse cx="148" cy="148" rx="8" ry="14" transform="rotate(-30 148 148)"/>
    <ellipse cx="132" cy="175" rx="8" ry="14" transform="rotate(-40 132 175)"/>
    <ellipse cx="120" cy="208" rx="8.5" ry="14" transform="rotate(-50 120 208)"/>
    <ellipse cx="114" cy="244" rx="8.5" ry="14.5" transform="rotate(-60 114 244)"/>
    <ellipse cx="115" cy="282" rx="8" ry="14" transform="rotate(-70 115 282)"/>
    <ellipse cx="124" cy="318" rx="7.5" ry="13" transform="rotate(-80 124 318)"/>

    <!-- Right Wheat Stem -->
    <path d="M 387 350 C 407 280 402 200 357 145" fill="none" stroke="url(#wheatGold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Grains -->
    <ellipse cx="364" cy="148" rx="8" ry="14" transform="rotate(30 364 148)"/>
    <ellipse cx="380" cy="175" rx="8" ry="14" transform="rotate(40 380 175)"/>
    <ellipse cx="392" cy="208" rx="8.5" ry="14" transform="rotate(50 392 208)"/>
    <ellipse cx="398" cy="244" rx="8.5" ry="14.5" transform="rotate(60 398 244)"/>
    <ellipse cx="397" cy="282" rx="8" ry="14" transform="rotate(70 397 282)"/>
    <ellipse cx="388" cy="318" rx="7.5" ry="13" transform="rotate(80 388 318)"/>
  </g>

  <!-- Crown / Baker Toque Symbol at Top -->
  <g transform="translate(256, 120) scale(0.9)" filter="url(#iconGlow)">
    <path d="M -32 20 C -42 8 -30 -14 -12 -12 C 0 -26 24 -20 22 -4 C 36 -6 44 14 32 20 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <rect x="-28" y="20" width="56" height="8" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Centerpiece: Artisanal Sourdough Boule & Golden Bread Dome -->
  <g filter="url(#badgeShadow)">
    <!-- Ambient Shadow Under Bread -->
    <ellipse cx="256" cy="328" rx="122" ry="24" fill="#000000" fill-opacity="0.55"/>

    <!-- Main Artisan Bread Boule -->
    <path d="M 148 305 C 145 220 190 178 256 178 C 322 178 367 220 364 305 C 362 332 150 332 148 305 Z" fill="url(#breadCrust)" stroke="#78350f" stroke-width="3"/>

    <!-- Artisan Scoring Gashes (Grigne / Sourdough Ears) -->
    <!-- Center Curved Gash -->
    <path d="M 215 204 C 235 235 240 270 236 302" stroke="url(#scoreGlow)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 215 204 C 235 235 240 270 236 302" stroke="#78350f" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Side Curved Gash -->
    <path d="M 270 202 C 285 232 288 266 282 298" stroke="url(#scoreGlow)" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M 270 202 C 285 232 288 266 282 298" stroke="#78350f" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Left Side Curved Gash -->
    <path d="M 178 230 C 192 254 195 278 190 298" stroke="url(#scoreGlow)" stroke-width="5" stroke-linecap="round"/>

    <!-- Flour Dusting on Top of Loaf -->
    <ellipse cx="254" cy="192" rx="42" ry="10" fill="#ffffff" fill-opacity="0.25"/>

    <!-- Golden Croissant Foreground Overlap -->
    <g transform="translate(256, 318) scale(1.18)">
      <!-- Back Shadow of Croissant -->
      <path d="M -70 8 C -55 24 55 24 70 8 C 55 -6 -55 -6 -70 8 Z" fill="#000000" fill-opacity="0.4"/>
      <!-- Main Croissant Crescent -->
      <path d="M -65 6 C -40 22 40 22 65 6 C 50 -10 15 -14 0 -14 C -15 -14 -50 -10 -65 6 Z" fill="url(#breadCrust)" stroke="#92400e" stroke-width="2"/>
      <!-- Croissant Flaky Segments -->
      <path d="M -22 -13 C -18 3 -18 10 -24 18" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 22 -13 C 18 3 18 10 24 18" stroke="#fef08a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 0 -14 C 0 3 0 10 0 20" stroke="#fde68a" stroke-width="3" stroke-linecap="round"/>
      <!-- Shading lines -->
      <path d="M -22 -13 C -18 3 -18 10 -24 18" stroke="#78350f" stroke-width="0.8"/>
      <path d="M 22 -13 C 18 3 18 10 24 18" stroke="#78350f" stroke-width="0.8"/>
    </g>
  </g>

  <!-- Sparkle Stars for Luxury Finish -->
  <g fill="#fde68a" opacity="0.85">
    <!-- Star 1 Top Right -->
    <path d="M 335 155 Q 345 155 345 145 Q 345 155 355 155 Q 345 155 345 165 Q 345 155 335 155 Z"/>
    <!-- Star 2 Top Left -->
    <path d="M 165 165 Q 173 165 173 157 Q 173 165 181 165 Q 173 165 173 173 Q 173 165 165 165 Z" transform="scale(0.85) translate(30, 20)"/>
  </g>

  <!-- Golden Seal Lower Star -->
  <polygon points="256,420 262,434 277,434 265,443 269,457 256,448 243,457 247,443 235,434 250,434" fill="url(#wheatGold)"/>
</svg>
